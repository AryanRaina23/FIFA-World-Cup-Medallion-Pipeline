    // Custom Markdown parser to render clean, aesthetic text and highlights
    function Markdown({ text }) {
      if (!text) return null;
      
      const lines = text.split("\n");
      
      return (
        <div className="space-y-2 text-charcoal-700 dark:text-charcoal-200">
          {lines.map((line, idx) => {
            const cleanLine = line.trim();
            
            if (cleanLine === "---") {
              return <hr key={idx} className="my-3 border-charcoal-200 dark:border-charcoal-800/60" />;
            }
            
            if (cleanLine.startsWith("###")) {
              const headerText = cleanLine.substring(3).trim();
              return (
                <h3 key={idx} className="text-xs font-bold text-orange-600 dark:text-orange-400 mt-3 mb-1 flex items-center gap-1.5 border-b border-charcoal-100 dark:border-charcoal-800/30 pb-0.5">
                  {headerText}
                </h3>
              );
            }
            if (cleanLine.startsWith("##")) {
              const headerText = cleanLine.substring(2).trim();
              return (
                <h2 key={idx} className="text-sm font-extrabold text-orange-600 dark:text-orange-400 mt-4 mb-2">
                  {headerText}
                </h2>
              );
            }
            if (cleanLine.startsWith("#")) {
              const headerText = cleanLine.substring(1).trim();
              return (
                <h1 key={idx} className="text-base font-black text-orange-600 dark:text-orange-400 mt-4 mb-2">
                  {headerText}
                </h1>
              );
            }
            
            if (cleanLine.startsWith("-") || cleanLine.startsWith("*")) {
              const bulletText = cleanLine.substring(1).trim();
              return (
                <ul key={idx} className="list-disc pl-4 space-y-0.5 my-1">
                  <li className="text-xs leading-relaxed text-charcoal-600 dark:text-charcoal-300">
                    {parseInlineStyles(bulletText)}
                  </li>
                </ul>
              );
            }
            
            const numMatch = cleanLine.match(/^(\d+)\.\s(.*)/);
            if (numMatch) {
              const num = numMatch[1];
              const numText = numMatch[2];
              return (
                <ol key={idx} className="list-decimal pl-4 space-y-0.5 my-1">
                  <li className="text-xs leading-relaxed text-charcoal-600 dark:text-charcoal-300">
                    {parseInlineStyles(numText)}
                  </li>
                </ol>
              );
            }
            
            if (cleanLine === "") return <div key={idx} className="h-1" />;
            
            return (
              <p key={idx} className="text-xs leading-relaxed">
                {parseInlineStyles(line)}
              </p>
            );
          })}
        </div>
      );
    }
    
    function parseInlineStyles(text) {
      if (!text) return "";
      const parts = text.split("**");
      return parts.map((part, i) => {
        if (i % 2 === 1) {
          return <strong key={i} className="font-bold text-orange-600 dark:text-orange-400 bg-orange-500/5 dark:bg-orange-500/10 px-1 py-0.5 rounded">{part}</strong>;
        }
        return part;
      });
    }

    function InteractiveResult({ result }) {
      const [viewMode, setViewMode] = useState("table"); 
      const [sortCol, setSortCol] = useState(null);
      const [sortDesc, setSortDesc] = useState(false);

      if (!result || !result.rows || result.rows.length === 0) return null;

      const columns = result.columns || (result.rows && result.rows.length > 0 ? Object.keys(result.rows[0]) : []);
      
      const numericCol = columns.find(col => {
        const isIdOrYear = col.toLowerCase().includes("year") || col.toLowerCase().includes("id");
        return !isIdOrYear && result.rows.some(row => typeof row[col] === 'number');
      });
      const labelCol = columns.find(col => col !== numericCol && typeof result.rows[0][col] === 'string') || columns[0];

      useEffect(() => {
        if (!numericCol) {
          setViewMode("table");
        }
      }, [numericCol]);

      const sortedRows = useMemo(() => {
        if (!sortCol) return result.rows;
        const sorted = [...result.rows].sort((a, b) => {
          let valA = a[sortCol];
          let valB = b[sortCol];
          if (valA === null || valA === undefined) return 1;
          if (valB === null || valB === undefined) return -1;
          if (typeof valA === 'number' && typeof valB === 'number') {
            return valA - valB;
          }
          return String(valA).localeCompare(String(valB));
        });
        return sortDesc ? sorted.reverse() : sorted;
      }, [result.rows, sortCol, sortDesc]);

      const handleSort = (col) => {
        if (sortCol === col) {
          setSortDesc(!sortDesc);
        } else {
          setSortCol(col);
          setSortDesc(true); 
        }
      };

      const maxVal = useMemo(() => {
        if (!numericCol) return 1;
        return Math.max(...result.rows.map(row => Number(row[numericCol]) || 0), 1);
      }, [result.rows, numericCol]);

      return (
        <div className="mt-4 border border-charcoal-200 dark:border-charcoal-800/80 rounded-xl bg-charcoal-50/50 dark:bg-charcoal-900/40 overflow-hidden text-xs">
          <div className="flex items-center justify-between px-3 py-2 border-b border-charcoal-200 dark:border-charcoal-800/80 bg-white dark:bg-charcoal-800/80">
            <span className="font-bold text-orange-500 uppercase tracking-wider text-[10px]">Database Rows ({result.rows.length})</span>
            <div className="flex gap-1">
              <button 
                onClick={() => setViewMode("table")}
                className={`px-2.5 py-1 rounded-md font-semibold text-[10px] transition-colors ${viewMode === "table" ? 'bg-orange-100 text-orange-600 dark:bg-orange-950/20 dark:text-orange-400' : 'text-charcoal-400 hover:bg-charcoal-100 dark:hover:bg-charcoal-800'}`}
              >
                📋 Grid Table
              </button>
              {numericCol && (
                <button 
                  onClick={() => setViewMode("chart")}
                  className={`px-2.5 py-1 rounded-md font-semibold text-[10px] transition-colors ${viewMode === "chart" ? 'bg-orange-100 text-orange-600 dark:bg-orange-950/20 dark:text-orange-400' : 'text-charcoal-400 hover:bg-charcoal-100 dark:hover:bg-charcoal-800'}`}
                >
                  📊 Visual Chart
                </button>
              )}
            </div>
          </div>

          <div className="p-3 overflow-x-auto no-scrollbar max-h-72">
            {viewMode === "table" ? (
              <table className="w-full border-collapse text-left">
                <thead>
                  <tr className="border-b className border-charcoal-200 dark:border-charcoal-800/80">
                    {columns.map(col => (
                      <th 
                        key={col}
                        onClick={() => handleSort(col)}
                        className="pb-2 font-bold text-charcoal-400 dark:text-charcoal-400 cursor-pointer hover:text-orange-500 select-none pr-3"
                      >
                        {col} {sortCol === col ? (sortDesc ? "↓" : "↑") : ""}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {sortedRows.map((row, rIdx) => (
                    <tr 
                      key={rIdx} 
                      className="border-b border-charcoal-100 dark:border-charcoal-800/40 last:border-0 hover:bg-charcoal-100/30 dark:hover:bg-charcoal-800/10"
                    >
                      {columns.map(col => (
                        <td key={col} className="py-2 pr-3 text-charcoal-700 dark:text-charcoal-300 font-mono text-[11px]">
                          {row[col] !== null ? String(row[col]) : <span className="italic text-charcoal-400">null</span>}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            ) : (
              <div className="space-y-3 py-2">
                {result.rows.slice(0, 10).map((row, idx) => {
                  const label = row[labelCol] || `Item ${idx+1}`;
                  const val = Number(row[numericCol]) || 0;
                  const pct = Math.min((val / maxVal) * 100, 100);
                  return (
                    <div key={idx} className="space-y-1">
                      <div className="flex justify-between font-semibold text-[10px] text-charcoal-600 dark:text-charcoal-400">
                        <span>{label}</span>
                        <span className="font-bold font-mono text-orange-500">{val}</span>
                      </div>
                      <div className="h-2 w-full bg-charcoal-200 dark:bg-charcoal-800 rounded-full overflow-hidden">
                        <div 
                          className="h-full bg-gradient-to-r from-brand-start to-brand-end rounded-full transition-all duration-700" 
                          style={{ width: `${pct}%` }}
                        ></div>
                      </div>
                    </div>
                  );
                })}
                {result.rows.length > 10 && (
                  <p className="text-[9px] text-charcoal-400 text-center italic mt-2">Showing top 10 rows for chart presentation</p>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    function App() {
      // Core states
      const [chats, setChats] = useState(() => {
        const saved = localStorage.getItem("fifa_chats");
        return saved ? JSON.parse(saved) : INITIAL_CHATS;
      });
      const [activeChatId, setActiveChatId] = useState(() => {
        return chats.length > 0 ? chats[0].id : null;
      });
      
      // Layout control states
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [schemaOpen, setSchemaOpen] = useState(false);
      const [darkMode, setDarkMode] = useState(() => {
        const saved = localStorage.getItem("theme");
        return saved ? saved === "dark" : false; 
      });
      
      // Interactive feature states
      const [searchQuery, setSearchQuery] = useState("");
      const [inputValue, setInputValue] = useState("");
      const [isGenerating, setIsGenerating] = useState(false);
      const [activeSqlId, setActiveSqlId] = useState(null); 
      const [toasts, setToasts] = useState([]);
      const [soundEnabled, setSoundEnabled] = useState(false);
      const [isListening, setIsListening] = useState(false);
      const [attachedFiles, setAttachedFiles] = useState([]);
      const [showFileDropdown, setShowFileDropdown] = useState(false);
      const [expandedTables, setExpandedTables] = useState({});
      const [liveStats, setLiveStats] = useState({ editions: "--", matches: "--", goals: "--", loading: true });

      const chatEndRef = useRef(null);

      // Fetch live statistics from backend
      useEffect(() => {
        const getStats = async () => {
          try {
            const res = await fetch(`${BASE_URL}/stats`);
            const data = await res.json();
            setLiveStats({
              editions: data.editions || "24",
              matches: data.matches ? data.matches.toLocaleString() : "1,004",
              goals: data.goals ? data.goals.toLocaleString() : "2,984",
              loading: false
            });
          } catch (e) {
            setLiveStats({ editions: "24", matches: "1,004", goals: "2,984", loading: false });
          }
        };
        getStats();
      }, []);

      // Sync state to LocalStorage
      useEffect(() => {
        localStorage.setItem("fifa_chats", JSON.stringify(chats));
      }, [chats]);

      // Sync dark mode class
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add("dark");
          localStorage.setItem("theme", "dark");
        } else {
          document.documentElement.classList.remove("dark");
          localStorage.setItem("theme", "light");
        }
      }, [darkMode]);

      // Auto scroll to bottom
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [chats, activeChatId, isGenerating]);

      // Active chat selector
      const activeChat = useMemo(() => {
        return chats.find(c => c.id === activeChatId) || null;
      }, [chats, activeChatId]);

      // Filter chats for sidebar
      const groupedChats = useMemo(() => {
        const filtered = chats.filter(c => 
          c.title.toLowerCase().includes(searchQuery.toLowerCase())
        );
        const groups = { today: [], yesterday: [], older: [] };
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const startOfYesterday = startOfToday - 24 * 3600 * 1000;

        filtered.forEach(chat => {
          if (chat.timestamp >= startOfToday) {
            groups.today.push(chat);
          } else if (chat.timestamp >= startOfYesterday) {
            groups.yesterday.push(chat);
          } else {
            groups.older.push(chat);
          }
        });
        return groups;
      }, [chats, searchQuery]);

      // Synth Sound Generator (Native Web Audio API)
      const playChime = (type) => {
        if (!soundEnabled) return;
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          if (type === "send") {
            osc.frequency.setValueAtTime(580, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.12);
            osc.start();
            osc.stop(ctx.currentTime + 0.12);
          } else if (type === "receive") {
            osc.frequency.setValueAtTime(520, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(740, ctx.currentTime + 0.18);
            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.18);
            osc.start();
            osc.stop(ctx.currentTime + 0.18);
          }
        } catch (e) {}
      };

      // Toast System helper
      const addToast = (message, type = "success") => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 2500);
      };

      // Create new chat
      const handleNewChat = () => {
        const newId = "chat-" + Date.now();
        const newChat = {
          id: newId,
          title: "New Conversation",
          timestamp: Date.now(),
          messages: []
        };
        setChats(prev => [newChat, ...prev]);
        setActiveChatId(newId);
        addToast("Created new conversation thread!");
        if (window.innerWidth < 768) {
          setSidebarOpen(false);
        }
      };

      // Delete a chat
      const handleDeleteChat = (id, e) => {
        e.stopPropagation();
        const updated = chats.filter(c => c.id !== id);
        setChats(updated);
        addToast("Conversation deleted.", "info");
        if (activeChatId === id) {
          setActiveChatId(updated.length > 0 ? updated[0].id : null);
        }
      };

      // Send Message logic
      const handleSendMessage = async (textToSend) => {
        const text = textToSend || inputValue;
        if (!text.trim() || isGenerating) return;

        setInputValue("");
        setIsGenerating(true);
        playChime("send");

        let currentChatId = activeChatId;
        let currentChat = activeChat;

        if (!currentChatId) {
          const newId = "chat-" + Date.now();
          currentChat = {
            id: newId,
            title: text.length > 30 ? text.substring(0, 30) + "..." : text,
            timestamp: Date.now(),
            messages: []
          };
          setChats(prev => [currentChat, ...prev]);
          setActiveChatId(newId);
          currentChatId = newId;
        }

        // Include file headers in question query if files are attached
        let processedText = text;
        if (attachedFiles.length > 0) {
          processedText = `[File attached: ${attachedFiles.join(", ")}] ` + text;
          setAttachedFiles([]); // Clear attachment chips
        }

        const userMsg = { role: "user", content: text };
        setChats(prev => prev.map(c => {
          if (c.id === currentChatId) {
            const newTitle = c.title === "New Conversation" ? 
              (text.length > 30 ? text.substring(0, 30) + "..." : text) : c.title;
            return {
              ...c,
              title: newTitle,
              timestamp: Date.now(),
              messages: [...c.messages, userMsg]
            };
          }
          return c;
        }));

        try {
          const payload = {
            question: processedText,
            session_id: currentChatId
          };

          const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          const botMsg = {
            role: "bot",
            content: data.answer || "Something went wrong.",
            sql: data.sql_used || null,
            sqlResult: data.sql_result || null
          };

          setChats(prev => prev.map(c => {
            if (c.id === currentChatId) {
              return { ...c, messages: [...c.messages, botMsg] };
            }
            return c;
          }));
          playChime("receive");

        } catch (err) {
          const botError = {
            role: "bot",
            content: "Connection error — could not reach the database backend on port 8000.",
            sql: null
          };
          setChats(prev => prev.map(c => {
            if (c.id === currentChatId) {
              return { ...c, messages: [...c.messages, botError] };
            }
            return c;
          }));
        } finally {
          setIsGenerating(false);
        }
      };

      const handleKeyDown = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      };

      // Voice Input Simulation
      const handleVoiceClick = () => {
        if (isListening) return;
        setIsListening(true);
        addToast("Voice recognition active... Speak now.", "info");

        // Simulate typing of speech in 3 seconds
        setTimeout(() => {
          setInputValue("Who won the World Cup in 2026?");
          setIsListening(false);
          addToast("Speech translated successfully!");
        }, 2200);
      };

      // File attachment simulator
      const handleAttachFile = (filename) => {
        setAttachedFiles(prev => [...prev, filename]);
        setShowFileDropdown(false);
        addToast(`Attached dataset: ${filename}`);
      };

      // Copy Text utility
      const copyToClipboard = (text, type = "Message") => {

                                title="Regenerate"
                              >
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H18"/></svg>
                              </button>
                              <button class="hover:text-emerald-500 p-0.5 rounded" title="Thumbs up">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"/></svg>
                              </button>
                              <button class="hover:text-red-500 p-0.5 rounded" title="Thumbs down">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14H5.236a2 2 0 01-1.789-2.894l3.5-7A2 2 0 018.737 3h4.018c.163 0 .326.02.485.06L17 4m-7 10V19a2 2 0 002 2h.095c.5 0 .905-.405.905-.905 0-.714.211-1.412.608-2.006L17 13V4m-7 10h2m5-10h2a2 2 0 012 2v6a2 2 0 01-2 2h-2.5"/></svg>
                              </button>
                            </React.Fragment>
                          )}
                        </div>
                      </div>
                    </div>
                  </div>
                ))}

                {/* GENERATING / TYPING LOADERS */}
                {isGenerating && (
                  <div class="flex gap-3.5 justify-start animate-pulse">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-brand-start to-brand-end flex items-center justify-center text-sm flex-shrink-0 shadow">
                      ⚽
                    </div>
                    <div class="bg-white dark:bg-charcoal-800/30 border border-charcoal-200/80 dark:border-charcoal-800/80 rounded-2xl p-4 flex items-center gap-1.5">
                      <span class="w-2 h-2 rounded-full bg-orange-500 animate-bounce" style={{ animationDelay: '0ms' }}></span>
                      <span class="w-2 h-2 rounded-full bg-orange-500 animate-bounce" style={{ animationDelay: '150ms' }}></span>
                      <span class="w-2 h-2 rounded-full bg-orange-500 animate-bounce" style={{ animationDelay: '300ms' }}></span>
                    </div>
                  </div>
                )}

                <div ref={chatEndRef} />
              </div>
            </div>

            {/* Bottom Floating Input panel */}
            <div class="p-4 border-t border-charcoal-200/50 dark:border-charcoal-800/50 bg-white/20 dark:bg-charcoal-900/20 backdrop-blur-md">
              <div class="max-w-[768px] mx-auto space-y-2">
                
                {/* Active Attachment Chips */}
                {attachedFiles.length > 0 && (
                  <div class="flex flex-wrap gap-1.5 px-2">
                    {attachedFiles.map((file, idx) => (
                      <span key={idx} class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-orange-100 dark:bg-orange-950/20 border border-orange-200/30 text-[10px] font-bold text-orange-600 dark:text-orange-400">
                        📄 {file}
                        <button 
                          onClick={() => setAttachedFiles(prev => prev.filter(f => f !== file))}
                          class="hover:text-orange-800 font-bold ml-0.5"
                        >
                          ×
                        </button>
                      </span>
                    ))}
                  </div>
                )}

                {/* Voice Listening Active visualizer */}
                {isListening && (
                  <div class="flex items-center gap-1.5 px-3 py-1 bg-orange-50 dark:bg-orange-950/10 text-orange-600 dark:text-orange-400 rounded-lg text-xs animate-pulse font-semibold">
                    <span class="w-1.5 h-3 bg-orange-500 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></span>
                    <span class="w-1.5 h-4 bg-orange-500 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></span>
                    <span class="w-1.5 h-2 bg-orange-500 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></span>
                    Voice recognition listening... speak your database query now.
                  </div>
                )}

                <div class="relative flex items-center bg-white dark:bg-charcoal-800/60 border border-charcoal-200 dark:border-charcoal-800 rounded-2xl p-2.5 shadow-lg shadow-charcoal-800/5 dark:shadow-charcoal-950/20 focus-within:border-orange-500 dark:focus-within:border-orange-500/50 transition-all duration-300">
                  
                  {/* Attach File Button */}
                  <div class="relative">
                    <button 
                      onClick={() => setShowFileDropdown(!showFileDropdown)}
                      class="p-2 rounded-xl hover:bg-charcoal-100 dark:hover:bg-charcoal-800 text-charcoal-400 hover:text-charcoal-600 dark:hover:text-charcoal-200 transition-colors"
                      title="Attach file"
                    >
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
                    </button>

                    {/* Mock Dropdown for File Attachment */}
                    {showFileDropdown && (
                      <div class="absolute bottom-12 left-0 w-48 rounded-xl bg-white dark:bg-charcoal-800 border border-charcoal-200 dark:border-charcoal-700 shadow-xl p-1 z-30 animate-fadeIn">
                        <button onClick={() => handleAttachFile("matches_2026.csv")} class="w-full text-left px-3 py-2 rounded-lg text-xs hover:bg-charcoal-100 dark:hover:bg-charcoal-700">📄 matches_2026.csv (Dataset)</button>
                        <button onClick={() => handleAttachFile("top_scorers.json")} class="w-full text-left px-3 py-2 rounded-lg text-xs hover:bg-charcoal-100 dark:hover:bg-charcoal-700">📄 top_scorers.json (Metadata)</button>
                        <button onClick={() => handleAttachFile("awards.xml")} class="w-full text-left px-3 py-2 rounded-lg text-xs hover:bg-charcoal-100 dark:hover:bg-charcoal-700">📄 awards.xml (DDL Logs)</button>
                      </div>
                    )}
                  </div>

                  {/* Textarea Input */}
                  <textarea 
                    value={inputValue}
                    onChange={(e) => setInputValue(e.target.value)}
                    onKeyDown={handleKeyDown}
                    placeholder="Ask anything about the World Cup data..."
                    rows="1"
                    class="flex-1 max-h-[160px] bg-transparent outline-none resize-none border-none pl-3 pr-2 py-1.5 text-sm placeholder-charcoal-400 text-charcoal-800 dark:text-charcoal-100"
                  ></textarea>

                  {/* Voice Input Button */}
                  <button 
                    onClick={handleVoiceClick}
                    class={`p-2 rounded-xl transition-colors mr-1 ${isListening ? 'text-orange-500 bg-orange-100 dark:bg-orange-950/20' : 'text-charcoal-400 hover:bg-charcoal-100 dark:hover:bg-charcoal-800 hover:text-charcoal-600 dark:hover:text-charcoal-200'}`}
                    title="Simulate Voice Input"
                  >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                  </button>

                  {/* Submit button */}
                  <button 
                    onClick={() => handleSendMessage()}
                    disabled={!inputValue.trim() || isGenerating}
                    class={`w-10 h-10 rounded-xl flex items-center justify-center text-white transition-all duration-300
                      ${inputValue.trim() && !isGenerating 
                        ? 'bg-gradient-to-tr from-brand-start to-brand-end hover:shadow-lg hover:shadow-orange-500/25 active:scale-95' 
                        : 'bg-charcoal-100 dark:bg-charcoal-800 text-charcoal-400 cursor-not-allowed opacity-50'}`}
                    title="Send Message"
                  >
                    <svg class="w-4 h-4 rotate-45 mr-0.5 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                  </button>
                </div>
              </div>
              
              <p class="text-[10px] text-center text-charcoal-400 mt-2 font-medium">
                FIFA World Cup Chatbot can generate SQL queries that alter database view counts. Verify queries before deployment.
              </p>
            </div>
            
          </div>

          {/* 3. SCHEMA EXPLORER (RIGHT COLLAPSIBLE PANEL) */}
          <div class={`h-full bg-white dark:bg-charcoal-900 border-l border-charcoal-200 dark:border-charcoal-800 flex flex-col transition-all duration-300 z-30
            ${schemaOpen ? 'w-[320px] translate-x-0' : 'w-0 translate-x-[320px]'}`}
          >
            {/* Header */}
            <div class="p-4 flex items-center justify-between border-b border-charcoal-100 dark:border-charcoal-800">
              <div class="flex items-center gap-2">
                <span class="text-base text-orange-500">📁</span>
                <span class="font-bold text-xs uppercase tracking-wider text-charcoal-700 dark:text-charcoal-200">Database Schema</span>
              </div>
              <button 
                onClick={() => setSchemaOpen(false)}
                class="p-1 rounded hover:bg-charcoal-100 dark:hover:bg-charcoal-800 text-charcoal-400 hover:text-charcoal-600"
              >
                ✕
              </button>
            </div>

            {/* Explanation note */}
            <div class="p-3 bg-orange-50/50 dark:bg-orange-950/10 border-b border-orange-100/30 text-[10.5px] text-charcoal-500 dark:text-charcoal-400 font-medium">
              💡 **Interactive tip**: Click any table or column name to instantly paste it into your chat box.
            </div>

            {/* Tables Explorer list */}
            <div class="flex-1 overflow-y-auto p-3 space-y-3 no-scrollbar">
              {SCHEMA_TABLES.map(table => (
                <div 
                  key={table.name} 
                  class="rounded-xl border border-charcoal-200/80 dark:border-charcoal-800/80 bg-white/40 dark:bg-charcoal-900/40 p-2.5 transition-all shadow-sm"
                >
                  <div 
                    onClick={() => toggleTableExpand(table.name)}
                    class="flex items-center justify-between cursor-pointer group"
                  >
                    <span 
                      onClick={(e) => { e.stopPropagation(); handlePasteSchemaTerm(table.name); }}
                      class="text-xs font-bold text-charcoal-800 dark:text-charcoal-200 hover:text-orange-500 hover:underline transition-colors"
                      title="Paste table name"
                    >
                      {table.name}
                    </span>
                    <span class="text-xs text-charcoal-400 group-hover:text-charcoal-600">
                      {expandedTables[table.name] ? '▼' : '▶'}
                    </span>
                  </div>
                  <p class="text-[10px] text-charcoal-400 mt-1">{table.desc}</p>
                  
                  {/* Expanded Columns details */}
                  {expandedTables[table.name] && (
                    <div class="mt-3.5 pt-2 border-t border-charcoal-100 dark:border-charcoal-800 space-y-2 animate-fadeIn">
                      {table.columns.map(col => (
                        <div 
                          key={col.name} 
                          onClick={() => handlePasteSchemaTerm(col.name)}
                          class="flex items-center justify-between p-1 rounded hover:bg-charcoal-100/60 dark:hover:bg-charcoal-800/40 cursor-pointer group"
                          title="Paste column name"
                        >
                          <span class="text-[11px] font-medium font-mono text-charcoal-600 dark:text-charcoal-300 group-hover:text-orange-500 group-hover:underline">
                            {col.name}
                          </span>
                          <span class="text-[9px] uppercase font-bold text-charcoal-400 font-mono">
                            {col.type}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
          
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
